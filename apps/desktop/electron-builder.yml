appId: com.farspeaklabs.tandem
productName: Tandem
copyright: "Copyright © 2026 Farspeak Labs LLC · MIT License · Based on Roughdraft by Nathan Baschez (MIT)"
directories:
  output: out
files:
  - dist/**
  - package.json
asar: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dir
  # Unsigned by default. build/package.sh signs when TANDEM_SIGN_IDENTITY is set
  # (e.g. in the untracked build/signing.env) and notarizes when a notarytool profile exists.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    LSMultipleInstancesProhibited: true
fileAssociations:
  - ext: [md, markdown]
    name: Markdown document
    role: Editor
    rank: Alternate
  - ext: [mmd, multimarkdown]
    name: MultiMarkdown document
    role: Editor
    rank: Alternate
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: "Tandem-${version}-win-${arch}.${ext}"
nsis:
  # Per-user install by default (%LOCALAPPDATA%\Programs\Tandem, where `tandem` looks for it); no admin rights needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Tandem
